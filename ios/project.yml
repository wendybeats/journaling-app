# Endpaper — XcodeGen project spec.
# Generate the Xcode project with:  brew install xcodegen && cd ios && xcodegen
# The .xcodeproj is generated, never committed.

name: Endpaper
options:
  bundleIdPrefix: com.wendellbarton
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# One scheme for everything: ⌘R runs the app, ⌘U runs the parity suite.
# (Without this, Xcode auto-creates a scheme per target and the test-only
# scheme ends up selected after a test run — which can't ⌘R.)
schemes:
  Endpaper:
    build:
      targets:
        Endpaper: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EndpaperTests
    profile:
      config: Release
    archive:
      config: Release

targets:
  Endpaper:
    type: application
    platform: iOS
    sources:
      - path: Endpaper
    info:
      path: Endpaper/Info.plist
      properties:
        CFBundleDisplayName: Endpaper            # decided July 24 (pending trademark screen)
        # Version wiring — without these, xcodegen writes a static 1.0/1
        # into Info.plist and MARKETING_VERSION/CURRENT_PROJECT_VERSION
        # never reach the bundle (ASC rejected an upload as "train '1.0'
        # is closed", 2026-08-20). Bump versions in settings.base only.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground          # bone / char, from the asset catalog
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Endpaper can lock your notebook behind Face ID.
        NSMicrophoneUsageDescription: Endpaper can take spoken notes — the words appear on your page.
        NSSpeechRecognitionUsageDescription: Speech is transcribed on this device. Nothing leaves your phone.
        NSCameraUsageDescription: Endpaper can photograph your handwriting — the words appear on your page.
        UIAppFonts:      # resources copy flat into the bundle root
          - Newsreader.ttf
          - Newsreader-Italic.ttf
          - InstrumentSans.ttf
          - FragmentMono-Regular.ttf
    entitlements:
      path: Endpaper/Endpaper.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.wendellbarton.endpaper
        # Key-value storage holds the trial stamp so deleting the app
        # can't hand out a second free week (see TrialGate).
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wendellbarton.endpaper
        # 1.0.2 was approved before this cycle's build went up — its train
        # is closed (ASC rejection, 2026-08-26). Consumed 1.0.3 build
        # numbers: 15 (stale checkout), 16 (superseded), 17 (uploaded
        # 2026-08-27, the release candidate). Next archive: 18.
        MARKETING_VERSION: 1.0.3
        CURRENT_PROJECT_VERSION: 18
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: DW5Z7N8HF9             # so command-line archives sign without overrides
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"            # iPhone-first, like the PDP
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Engine parity: the Swift engine must agree with the JS reference
  # engine over the shared corpus (tools/parity). Run with ⌘U.
  EndpaperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: ../tools/parity/corpus.json
        buildPhase: resources
      - path: ../tools/parity/expected.json
        buildPhase: resources
    settings:
      base:
        # Test bundles have no info: block — let Xcode generate the plist.
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.wendellbarton.endpaper.tests
    dependencies:
      - target: Endpaper
