<!doctype html>
<!-- Rule card — one sentence of product truth, set like the page.
     Rendered by render-cards.mjs at 1080×1350 (feed) and 1080×1920
     (story), light and dark via prefers-color-scheme. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Newsreader';
    src: url('../../../fonts/Newsreader.woff2') format('woff2');
    font-weight: 400 500;
  }
  @font-face {
    font-family: 'Newsreader';
    src: url('../../../fonts/Newsreader-italic.woff2') format('woff2');
    font-weight: 400; font-style: italic;
  }
  @font-face {
    font-family: 'Fragment Mono';
    src: url('../../../fonts/FragmentMono.woff2') format('woff2');
  }
  :root {
    --page: #E8E6E1;
    --ink: #1A1A1A;
    --written: #262320;
    --meta: #A9A6A0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --page: #161514; --ink: #E8E6E1; --written: #DEDAD3; --meta: #6B6862; }
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    background: var(--page);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 96px;
    font-family: 'Newsreader', serif;
  }
  .dots { display: flex; gap: 14px; }
  .dots span { width: 13px; height: 13px; border-radius: 50%; background: var(--ink); }
  .dots span.empty { background: transparent; box-shadow: inset 0 0 0 2px var(--meta); }
  .rule {
    font-size: 72px;
    line-height: 1.3;
    color: var(--written);
    letter-spacing: -0.005em;
    max-width: 22ch;
    text-wrap: balance;
  }
  .rule em { font-style: italic; }
  footer {
    font-family: 'Fragment Mono', monospace;
    font-size: 22px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--meta);
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>
  <div class="dots" aria-hidden="true">
    <span></span><span></span><span class="empty"></span><span></span><span></span><span></span><span class="empty"></span><span></span>
  </div>
  <div class="rule" id="rule">What you write can’t be edited or deleted. That’s the point.</div>
  <footer>
    <span>Endpaper</span>
    <span>endpaper.space</span>
  </footer>
</body>
</html>
